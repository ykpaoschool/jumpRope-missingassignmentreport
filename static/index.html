<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>缺交作业邮件发送 Missing Work Mailer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>缺交作业邮件发送 <span class="en">Missing Work Mailer</span></h1>
    <div class="conn">
      <span id="conn-status" class="badge">连接状态检测中…</span>
      <button id="btn-test-conn" class="btn btn-ghost">测试连接</button>
    </div>
  </header>

  <main class="wrap">
    <!-- 上传 -->
    <section class="card">
      <h2>1. 上传 Excel</h2>
      <div class="upload-row">
        <input type="file" id="file-input" accept=".xlsx,.xls" />
        <button id="btn-upload" class="btn btn-primary">上传并解析</button>
      </div>
      <div id="summary" class="summary hidden"></div>
      <ul id="warnings" class="warnings"></ul>
    </section>

    <!-- 待发送列表 -->
    <section class="card">
      <h2>2. 待发送列表</h2>
      <div class="table-toolbar">
        <label class="check"><input type="checkbox" id="check-all" /> 全选</label>
        <span class="hint">未勾选时点击“发送”将发送全部（有邮箱的）学生</span>
      </div>
      <div class="table-scroll">
        <table class="grid">
          <thead>
            <tr>
              <th></th>
              <th>学生ID</th>
              <th>年级</th>
              <th>班级</th>
              <th>家长邮箱</th>
              <th>缺交条数</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="student-tbody">
            <tr><td colspan="7" class="empty">尚未上传文件</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 发送 -->
    <section class="card">
      <h2>3. 发送邮件</h2>
      <div class="send-controls">
        <div class="mode-group">
          <label class="radio"><input type="radio" name="mode" value="test" checked /> 测试模式（发到测试邮箱）</label>
          <label class="radio"><input type="radio" name="mode" value="live" /> 正式发送（发给家长）</label>
        </div>
        <div class="mode-group">
          <span class="group-label">发送渠道</span>
          <label class="radio"><input type="radio" name="channel" value="graph" checked /> Office 365 (Graph)</label>
          <label class="radio"><input type="radio" name="channel" value="smtp" /> SMTP（快速测试）</label>
        </div>
        <div id="test-email-row" class="field">
          <label for="test-email">测试邮箱</label>
          <input type="email" id="test-email" placeholder="you@example.com" />
        </div>
        <button id="btn-send" class="btn btn-danger">发送</button>
      </div>
      <div id="send-result" class="send-result hidden"></div>
    </section>
  </main>

  <!-- 预览弹窗 -->
  <div id="preview-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span id="preview-title">邮件预览</span>
        <button id="btn-close-preview" class="btn btn-ghost">关闭</button>
      </div>
      <div class="modal-subject" id="preview-subject"></div>
      <iframe id="preview-frame" title="邮件预览"></iframe>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
